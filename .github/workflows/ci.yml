name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Os testes de integracao (@SpringBootTest) usam um Postgres real.
    # Mesmas credenciais do docker-compose.yml / application.properties.
    services:
      postgres:
        image: postgres:13.22
        env:
          POSTGRES_USER: zerofumo_user
          POSTGRES_PASSWORD: zerofumo_pass
          POSTGRES_DB: zerofumo_DB
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U zerofumo_user -d zerofumo_DB"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/zerofumo_DB

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes
        run: ./mvnw -B verify
